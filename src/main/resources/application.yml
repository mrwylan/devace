spring:
  application:
    name: devace
  # Secrets and environment-specific values come from environment variables only.
  datasource:
    url: ${DEVACE_DB_URL}
    username: ${DEVACE_DB_USER}
    password: ${DEVACE_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  mail:
    # E-Mail-System für die Einladungen (UC-001); alle Werte aus der Umgebung.
    host: ${DEVACE_MAIL_HOST:}
    port: ${DEVACE_MAIL_PORT:587}
    username: ${DEVACE_MAIL_USER:}
    password: ${DEVACE_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${DEVACE_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${DEVACE_MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

devace:
  mail:
    # Absenderadresse der Einladungen; ohne sie scheitert jeder Versand (UC-001 A4).
    absender: ${DEVACE_MAIL_ABSENDER:}
  einladung:
    # Öffentliche Adresse der Anwendung für den Link in der E-Mail (UC-001 BR-007).
    basis-url: ${DEVACE_BASIS_URL:http://localhost:8080}
  admin:
    # Optional first administrator, created at startup when none exists (OQ-031).
    username: ${DEVACE_ADMIN_USERNAME:}
    password: ${DEVACE_ADMIN_PASSWORD:}
  ki:
    # KI-Modell nur über Spring AI und OpenRouter; der Schlüssel kommt aus der Umgebung.
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY:}
    modelle:
      # Modell-ID je Aufgabe (OQ-034); leer, bis eine eingerichtet ist.
      fragenkatalog: ${DEVACE_KI_MODELL_FRAGENKATALOG:}
      # Entscheidungsmodell Jev für die Bewertung der Antworten (UC-002, ADR-003); latest als Standard,
      # eine konkrete Version über DEVACE_KI_MODELL_BEWERTUNG pinnen.
      bewertung: ${DEVACE_KI_MODELL_BEWERTUNG:~typesafe/jev-latest}
      # Modell-ID für den Textreport zum Abschluss (UC-003); leer, bis eine eingerichtet ist.
      textreport: ${DEVACE_KI_MODELL_TEXTREPORT:}
